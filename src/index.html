<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- =========================================================
       DEFAULT SEO METADATA
       Individual public pages can override these values
       through Angular's Title and Meta services.
       ========================================================= -->

  <title>Zebron | Resources, Jobs &amp; Opportunities</title>

  <meta
    name="description"
    content="Zebron helps immigrants and underserved communities discover resources, jobs, training, organizations, and opportunities."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://zebron.org/"
  >

  <!-- =========================================================
       OPEN GRAPH
       ========================================================= -->

  <meta
    property="og:site_name"
    content="Zebron"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="Zebron | Resources, Jobs &amp; Opportunities"
  >

  <meta
    property="og:description"
    content="Discover resources, jobs, training, organizations, and opportunities on Zebron."
  >

  <meta
    property="og:url"
    content="https://zebron.org/"
  >

  <!-- =========================================================
       TWITTER / X
       ========================================================= -->

  <meta
    name="twitter:card"
    content="summary"
  >

  <meta
    name="twitter:title"
    content="Zebron | Resources, Jobs &amp; Opportunities"
  >

  <meta
    name="twitter:description"
    content="Discover resources, jobs, training, organizations, and opportunities on Zebron."
  >

  <!-- =========================================================
       APPLICATION
       ========================================================= -->

  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- =========================================================
       FAVICON
       ========================================================= -->

  <link
    rel="icon"
    type="image/svg+xml"
    href="/zebron-favicon.svg"
  >

  <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->

  <!-- =========================================================
       FONTS
       ========================================================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  >
</head>

<body>
  <app-root></app-root>
</body>
</html>
