<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A light rail train crossing a bridge past a construction crane and a highway</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="70" fill="#FFFFFF" opacity="0.8"/>
  <!-- crane -->
  <g stroke="#F59E0B" stroke-width="10" fill="none">
    <line x1="200" y1="80" x2="200" y2="400"/>
    <line x1="120" y1="90" x2="520" y2="90"/>
    <line x1="200" y1="40" x2="120" y2="90"/><line x1="200" y1="40" x2="480" y2="90"/>
    <line x1="440" y1="90" x2="440" y2="200"/>
  </g>
  <rect x="415" y="200" width="50" height="34" fill="#032D42"/>
  <g stroke="#F59E0B" stroke-width="4"><line x1="186" y1="120" x2="214" y2="150"/><line x1="214" y1="150" x2="186" y2="180"/><line x1="186" y1="180" x2="214" y2="210"/><line x1="214" y1="210" x2="186" y2="240"/><line x1="186" y1="240" x2="214" y2="270"/></g>
  <!-- city -->
  <g fill="#A78BFA" opacity="0.6">
    <rect x="600" y="200" width="90" height="200"/><rect x="700" y="160" width="70" height="240"/><rect x="780" y="230" width="110" height="170"/><rect x="900" y="190" width="80" height="210"/><rect x="990" y="240" width="120" height="160"/>
  </g>
  <!-- bridge -->
  <rect x="0" y="380" width="1200" height="34" fill="#475569"/>
  <g fill="#64748B"><rect x="140" y="414" width="40" height="216"/><rect x="560" y="414" width="40" height="216"/><rect x="980" y="414" width="40" height="216"/></g>
  <path d="M180 414 Q370 520 560 414" fill="none" stroke="#64748B" stroke-width="14"/>
  <path d="M600 414 Q790 520 980 414" fill="none" stroke="#64748B" stroke-width="14"/>
  <!-- catenary -->
  <line x1="0" y1="250" x2="1200" y2="250" stroke="#334155" stroke-width="3"/>
  <!-- train -->
  <g transform="translate(470 285)">
    <line x1="160" y1="-35" x2="190" y2="0" stroke="#334155" stroke-width="5"/>
    <path d="M0 10 H560 Q620 10 640 60 L650 95 H0 Z" fill="#5B3FB3"/>
    <rect x="0" y="70" width="650" height="12" fill="#FCD34D"/>
    <g fill="#E0F2FE">
      <rect x="30" y="28" width="70" height="36" rx="6"/><rect x="120" y="28" width="70" height="36" rx="6"/><rect x="210" y="28" width="70" height="36" rx="6"/>
      <rect x="320" y="28" width="70" height="36" rx="6"/><rect x="410" y="28" width="70" height="36" rx="6"/><path d="M560 28 H600 Q620 30 628 64 H560 Z"/>
    </g>
    <line x1="300" y1="10" x2="300" y2="95" stroke="#3B2585" stroke-width="4"/>
    <g fill="#1E293B"><circle cx="70" cy="98" r="10"/><circle cx="110" cy="98" r="10"/><circle cx="520" cy="98" r="10"/><circle cx="560" cy="98" r="10"/></g>
  </g>
  <!-- road below -->
  <rect y="560" width="1200" height="70" fill="#334155"/>
  <g fill="#FCD34D"><rect x="40" y="590" width="70" height="8"/><rect x="200" y="590" width="70" height="8"/><rect x="360" y="590" width="70" height="8"/><rect x="520" y="590" width="70" height="8"/><rect x="680" y="590" width="70" height="8"/><rect x="840" y="590" width="70" height="8"/><rect x="1000" y="590" width="70" height="8"/></g>
  <!-- cone -->
  <g transform="translate(330 500)"><polygon points="30,0 60,60 0,60" fill="#F97316"/><rect x="12" y="28" width="36" height="8" fill="#FFFFFF"/><rect x="-6" y="58" width="72" height="10" rx="3" fill="#F97316"/></g>
</svg>
