<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A grocery bag of fresh food beside a bowl of warm soup on a kitchen table</title>
  <rect width="1200" height="630" fill="#FEF3C7"/>
  <circle cx="160" cy="120" r="180" fill="#FDE68A"/>
  <circle cx="1080" cy="80" r="150" fill="#FCD34D" opacity="0.6"/>
  <!-- table -->
  <rect y="470" width="1200" height="160" fill="#B45309"/>
  <rect y="470" width="1200" height="20" fill="#92400E"/>
  <!-- bag -->
  <g transform="translate(160 170)">
    <!-- produce -->
    <rect x="70" y="-40" width="26" height="140" rx="10" fill="#2A835F"/>
    <path d="M83 -40 l-30 -50 M83 -40 l0 -60 M83 -40 l30 -50" stroke="#2A835F" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="190" cy="10" rx="70" ry="40" fill="#F59E0B"/>
    <path d="M140 0 q50 -10 100 0" stroke="#B45309" stroke-width="5" fill="none"/>
    <circle cx="270" cy="30" r="45" fill="#EF4444"/><path d="M270 -15 q8 -18 22 -22" stroke="#7C2D12" stroke-width="6" fill="none"/>
    <path d="M30 40 L340 40 L310 300 L60 300 Z" fill="#D6A16A"/>
    <path d="M30 40 L340 40 L336 70 L34 70 Z" fill="#C08552"/>
    <circle cx="185" cy="175" r="44" fill="#FFFFFF" opacity="0.55"/>
    <path d="M185 205 c-30 -22 -36 -36 -32 -48 c4 -14 24 -16 32 0 c8 -16 28 -14 32 0 c4 12 -2 26 -32 48z" fill="#EF6F5E"/>
  </g>
  <!-- bowl of soup -->
  <g transform="translate(760 330)">
    <path d="M-30 140 Q-30 -30 0 0" fill="none"/>
    <g stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M60 -40 q-20 -30 0 -60 q20 -30 0 -60"/><path d="M130 -30 q-20 -30 0 -60 q20 -30 0 -60"/><path d="M200 -40 q-20 -30 0 -60 q20 -30 0 -60"/>
    </g>
    <ellipse cx="130" cy="20" rx="190" ry="40" fill="#F97316"/>
    <circle cx="70" cy="18" r="12" fill="#2A835F"/><circle cx="150" cy="25" r="10" fill="#FCD34D"/><circle cx="200" cy="12" r="11" fill="#EF4444"/><circle cx="110" cy="8" r="9" fill="#2A835F"/>
    <path d="M-60 20 Q-50 170 130 170 Q310 170 320 20 Z" fill="#007979"/>
    <path d="M-60 20 Q-58 40 -50 60 L310 60 Q318 40 320 20 Z" fill="#12BFC3"/>
    <ellipse cx="130" cy="172" rx="90" ry="12" fill="#032D42" opacity="0.3"/>
    <!-- spoon -->
    <rect x="300" y="-100" width="16" height="170" rx="8" fill="#94A3B8" transform="rotate(25 308 -15)"/>
  </g>
  <!-- bread -->
  <g transform="translate(560 420)">
    <path d="M0 50 Q0 -10 80 -10 Q160 -10 160 50 Z" fill="#D97706"/>
    <path d="M40 20 l15 -15 M80 20 l15 -15 M120 20 l15 -15" stroke="#92400E" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
