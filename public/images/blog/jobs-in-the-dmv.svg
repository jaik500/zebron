<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A city skyline at sunrise with a briefcase and an arrow climbing upward</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#032D42"/><stop offset="1" stop-color="#007979"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="420" r="190" fill="#F59E0B" opacity="0.85"/>
  <!-- skyline -->
  <g fill="#0B3B52">
    <rect x="40" y="330" width="110" height="300"/><rect x="160" y="260" width="90" height="370"/><rect x="260" y="360" width="120" height="270"/>
    <rect x="390" y="300" width="80" height="330"/>
    <!-- dome -->
    <rect x="500" y="380" width="200" height="250"/><path d="M520 380 Q600 270 680 380 Z"/><rect x="592" y="250" width="16" height="40"/>
    <rect x="730" y="290" width="100" height="340"/><rect x="840" y="350" width="120" height="280"/><rect x="970" y="250" width="90" height="380"/><rect x="1070" y="320" width="100" height="310"/>
  </g>
  <g fill="#FCD34D" opacity="0.8">
    <rect x="60" y="360" width="16" height="16"/><rect x="100" y="400" width="16" height="16"/><rect x="180" y="300" width="14" height="14"/><rect x="215" y="350" width="14" height="14"/>
    <rect x="290" y="390" width="16" height="16"/><rect x="760" y="320" width="14" height="14"/><rect x="790" y="370" width="14" height="14"/><rect x="870" y="380" width="16" height="16"/>
    <rect x="990" y="290" width="14" height="14"/><rect x="1020" y="340" width="14" height="14"/><rect x="1100" y="360" width="16" height="16"/>
  </g>
  <!-- rising arrow -->
  <polyline points="120,250 330,180 480,210 700,110 900,140 1080,40" fill="none" stroke="#12BFC3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1112,22 1046,26 1088,82" fill="#12BFC3"/>
  <!-- briefcase -->
  <g transform="translate(800 450) scale(0.8)">
    <rect x="80" y="-30" width="100" height="40" rx="14" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <rect width="260" height="170" rx="20" fill="#FFFFFF"/>
    <rect y="60" width="260" height="16" fill="#E5F4F4"/>
    <rect x="112" y="52" width="36" height="32" rx="6" fill="#007979"/>
  </g>
</svg>
