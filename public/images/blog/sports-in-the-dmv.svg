<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A running track curving past a stadium, with a soccer ball, a basketball and a whistle</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#2A835F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- stadium -->
  <g transform="translate(600 300)">
    <ellipse cx="0" cy="40" rx="430" ry="120" fill="#032D42" opacity="0.35"/>
    <path d="M-400 30 Q0 -160 400 30 L400 70 Q0 -100 -400 70 Z" fill="#FFFFFF" opacity="0.9"/>
    <g stroke="#032D42" stroke-width="5" opacity="0.5">
      <line x1="-300" y1="-10" x2="-300" y2="40"/><line x1="-150" y1="-55" x2="-150" y2="0"/><line x1="0" y1="-70" x2="0" y2="-15"/><line x1="150" y1="-55" x2="150" y2="0"/><line x1="300" y1="-10" x2="300" y2="40"/>
    </g>
    <g fill="#F59E0B"><circle cx="-300" cy="-30" r="10"/><circle cx="-150" cy="-75" r="10"/><circle cx="0" cy="-90" r="10"/><circle cx="150" cy="-75" r="10"/><circle cx="300" cy="-30" r="10"/></g>
  </g>
  <!-- field -->
  <path d="M0 430 Q600 330 1200 430 V630 H0 Z" fill="#2A835F"/>
  <!-- track lanes -->
  <g fill="none" stroke-width="16">
    <path d="M-20 520 Q600 400 1220 520" stroke="#EF6F5E"/>
    <path d="M-20 556 Q600 436 1220 556" stroke="#E25B4A"/>
    <path d="M-20 592 Q600 472 1220 592" stroke="#EF6F5E"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="4">
    <path d="M-20 538 Q600 418 1220 538"/><path d="M-20 574 Q600 454 1220 574"/><path d="M-20 610 Q600 490 1220 610"/>
  </g>
  <!-- soccer ball -->
  <g transform="translate(250 330)">
    <circle r="78" fill="#FFFFFF" stroke="#032D42" stroke-width="5"/>
    <polygon points="0,-26 25,-8 16,22 -16,22 -25,-8" fill="#032D42"/>
    <polygon points="0,-78 18,-62 0,-48 -18,-62" fill="#032D42"/>
    <polygon points="66,-30 74,-6 52,0 46,-22" fill="#032D42"/>
    <polygon points="-66,-30 -46,-22 -52,0 -74,-6" fill="#032D42"/>
    <polygon points="44,60 26,54 30,36 52,40" fill="#032D42"/>
    <polygon points="-44,60 -52,40 -30,36 -26,54" fill="#032D42"/>
  </g>
  <!-- basketball -->
  <g transform="translate(950 320)">
    <circle r="85" fill="#F97316" stroke="#7C2D12" stroke-width="5"/>
    <g fill="none" stroke="#7C2D12" stroke-width="5">
      <line x1="-85" y1="0" x2="85" y2="0"/><line x1="0" y1="-85" x2="0" y2="85"/>
      <path d="M-60 -60 Q-20 0 -60 60"/><path d="M60 -60 Q20 0 60 60"/>
    </g>
  </g>
  <!-- whistle -->
  <g transform="translate(600 500) rotate(-12)">
    <rect x="-70" y="-30" width="110" height="60" rx="30" fill="#FCD34D"/>
    <rect x="20" y="-30" width="70" height="26" rx="6" fill="#FCD34D"/>
    <circle cx="-40" cy="0" r="14" fill="#B45309"/>
    <path d="M-70 0 C -120 -10 -130 -60 -100 -80" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  </g>
</svg>
